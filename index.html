function wAsk(id,c){const g=c.getContext('2d',{willReadFrequently:true}).getImageData(0,0,c.width,c.height);return new Promise(r=>{wPend[id]=r;wWk.postMessage({id,buf:g.data.buffer,w:g.width,h:g.height},[g.data.buffer])})}
function setupWasm(){return new Promise(ok=>{if(!window.Worker)return ok(false);try{wWk=new Worker('./vendor/zxingw/worker.js')}catch(e){return ok(false)}wWk.onmessage=e=>{const d=e.data||{};if(d.ready!==undefined){wOk=!!d.ready;if(wOk)engine+='+wasm';ok(wOk);return}const f=wPend[d.id];if(f){delete wPend[d.id];f(d)}};wWk.onerror=()=>ok(false);setTimeout(()=>ok(wOk),15000)})}
function centerPick(a){const list=(a||[]).filter(x=>x&&x.rawValue);if(!list.length)return[];if(list.length===1)return[list[0].rawValue];const vw=video.videoWidth||1,vh=video.videoHeight||1,cx=vw/2,cy=vh/2,best={};list.forEach(x=>{let d=0;const b=x.boundingBox;if(b){const dx=b.x+b.width/2-cx,dy=b.y+b.height/2-cy;d=Math.sqrt(dx*dx+dy*dy)}const v=x.rawValue;if(!(v in best)||d<best[v])best[v]=d});const vs=Object.keys(best).sort((p,q)=>best[p]-best[q]);multiT=Date.now();if(vs.length===1)return[vs[0]];if(best[vs[0]]<=Math.min(vw,vh)*0.35)return[vs[0]];return[]}
async function scan(){if(!scanning)return;if(paused||panelOpen){await new Promise(r=>setTimeout(r,200));if(scanning)requestAnimationFrame(scan);return}const quiet=Date.now()<msgUntil;if(step==='bar'){const fast=Date.now()-fastT<FAST_MS;let vals=[];const det=(fast?(detFast||detWide):(detWide||detFast));try{if(det&&video.videoWidth)vals=centerPick(await det.detect(video))}catch(e){detFast=null;detWide=null;if(!quiet)msg('原生识别不可用，已切换到 zxing',true)}if(!vals.length&&(wOk||window.ZXing)){wPass++;const f=cropFrame(wPass%3===0);if(f){if(wOk){const id=++wSeq,r=await Promise.race([wAsk(id,f),new Promise(q=>setTimeout(()=>q(1),1500))]);delete wPend[id];if(r&&r!==1){if(r.text)vals=[r.text];else if(r.err){wOk=false;try{wWk.terminate()}catch(e){}wWk=null}}}else if(window.ZXing){try{const r=decodeZxing(f,fast?ZX_FAST:ZX_WIDE);if(r)vals=[r]}catch(e){}}}}if(vals.length){const v=vals[0];if(v===cand&&Date.now()-candT<CONFIRM_MS)candN++;else{if(cand&&cand!==v)flipT=Date.now();cand=v;candN=1}candT=Date.now();if(candN>=CONFIRM_N){const c2=cand;cand='';candN=0;if(c2!==last||blanked){last=c2;blanked=false;fastT=Date.now();ocrFail=0;checked=false;onScan(c2)}else if(!quiet)msg('已扫过：'+last+'，移开条码后可扫下一个')}else if(!quiet)msg(Date.now()-flipT<1200?'识别到多个不同的码：只对准一个条码、稳住一下':'条码确认中…')}else{blanked=true;cand='';candN=0;if(!quiet){if(Date.now()-multiT<1200)msg('画面里有多个条码：只把要扫的那个对准画面中央');else msg(fast?'对准条码即可':'扫不到？条码放画面中间、靠近些、避开反光')}}}else if(!quiet)msg('拖动绿框套住箱面规格文字，再点下方“拍照识别尺寸”');await new Promise(r=>setTimeout(r,90));if(scanning)requestAnimationFrame(scan)}
async function ocr(){if(ocrBusy)return null;ocrBusy=true;try{const w=await getTess();if(!video.videoWidth)throw new Error('取不到相机画面');const cnt={},seen=[],ok3=g=>g&&g.every(x=>+x>=5&&+x<=300),add=g=>{if(!g)return;const k=g.join('X');if(!(k in cnt)){cnt[k]=0;seen.push(k)}cnt[k]++};let raw='';const run=async list=>{for(let i=0;i<list.length;i++){const c=list[i];await w.setParameters({tessedit_pageseg_mode:String(c[0])});const t=clean((await w.recognize(c[1])).data.text);if(t.length>raw.length)raw=t;const g=pick3(t);add(g);if(i===1&&g&&ok3(g)&&cnt[g.join('X')]===2)return}};const best=()=>{let r=null;for(const k of seen){if(!r||cnt[k]>cnt[r]||(cnt[k]===cnt[r]&&ok3(k.split('X'))&&!ok3(r.split('X'))))r=k}return r};const A=measImage(0,2),B=measImage(0,1);await run([[8,A],[6,A],[8,B],[6,B],[7,A],[3,A]]);let m=best();if(!m||!ok3(m.split('X'))){const C=measImage(1,2);await run([[8,C],[6,C],[3,C]]);m=best()}lastRaw=raw;if(m)ocrFail=0;else{ocrFail++;if(!checked&&ocrFail>=3){checked=true;await selfCheck();await new Promise(r2=>setTimeout(r2,6000))}}return m?m.split('X'):null}catch(e){msg('规格识别出错：'+(e.message||e),true);console.warn('OCR:',e);return null}finally{ocrBusy=false}}
// 扫码路由：编辑态实时追加 SKU / 拍照尺寸回填时忽略 / 空闲时新建一箱
function live(t,err){const el=$("boxLive");if(el){el.textContent=t;el.className='live'+(err?' bad':'')}}
function onScan(code){if(ocrAim)return;if(!boxDraft){boxDraft=newBoxDraft();boxDraft.items=[{sku:code,units:defUnits()}];openBoxDlg();return}if(scanTarget!=null&&boxDraft.items[scanTarget]){const i=scanTarget;scanTarget=null;paused=true;flushItems();boxDraft.items[i].sku=code;renderItems();live('✓ 已加入第 '+(i+1)+' 行：'+code+' · 本箱 '+boxDraft.items.filter(it=>it.sku).length+' 个 SKU');return}}
function newBoxDraft(){return{len:DEF_DIMS[0],wid:DEF_DIMS[1],hei:DEF_DIMS[2],qty:'1',wgt:DEF_WGT,items:[{sku:'',units:defUnits()}]}}
function openBoxDlg(){paused=true;scanTarget=null;shotBtn.className='shot alt hidden';renderBoxDlg();mask.className='sheet';live('逐条添加：点“＋扫码加一个 SKU”扫一个，或点行内“扫码”重填 · 待传 '+boxCount()+' 箱')}
function renderBoxDlg(){bLen.value=boxDraft.len;bWid.value=boxDraft.wid;bHei.value=boxDraft.hei;bQty.value=boxDraft.qty;bWgt.value=boxDraft.wgt;renderItems()}
function renderItems(){itemList.innerHTML=boxDraft.items.map((it,i)=>'<div class="itemrow"><input class="itSku" data-i="'+i+'" value="'+esc(it.sku)+'" placeholder="SKU"><button class="itScan" data-i="'+i+'" type="button">扫码</button><input class="itUnits" data-i="'+i+'" inputmode="numeric" value="'+esc(it.units)+'" placeholder="单箱"><s data-i="'+i+'">✕</s></div>').join('');updateTotal()}
// 合计：当前箱各 SKU 单箱数量累加（与 OMS 箱级“单箱数量”一致），直接读输入框实时统计
function updateTotal(){let s=0;itemList.querySelectorAll('.itUnits').forEach(inp=>{const n=parseInt(inp.value,10);if(!isNaN(n))s+=n});const el=$("itemTotal");if(el)el.textContent='合计：'+s+'（各 SKU 单箱数量累加）'}
function flushItems(){if(!boxDraft)return;boxDraft.len=bLen.value.trim();boxDraft.wid=bWid.value.trim();boxDraft.hei=bHei.value.trim();boxDraft.qty=bQty.value.trim();boxDraft.wgt=bWgt.value.trim();itemList.querySelectorAll('.itemrow').forEach(row=>{const i=+row.querySelector('.itSku').dataset.i,it=boxDraft.items[i];if(it){it.sku=row.querySelector('.itSku').value.trim();it.units=row.querySelector('.itUnits').value.trim()}})}
function addItem(){flushItems();boxDraft.items.push({sku:'',units:defUnits()});renderItems();const rows=itemList.querySelectorAll('.itSku');if(rows.length)rows[rows.length-1].focus()}
function delItem(i){flushItems();if(boxDraft.items.length<=1){live('至少保留一个 SKU',true);return}boxDraft.items.splice(i,1);scanTarget=null;renderItems()}
function armScan(i){if(!boxDraft||!boxDraft.items[i])return;flushItems();scanTarget=i;paused=false;msgUntil=Date.now()+4000;live('对准条码，扫到的 SKU 填入第 '+(i+1)+' 行…')}
function armNewSku(){if(!boxDraft)return;flushItems();let idx=boxDraft.items.length?boxDraft.items.length-1:-1;if(idx<0||boxDraft.items[idx].sku){boxDraft.items.push({sku:'',units:defUnits()});idx=boxDraft.items.length-1}renderItems();armScan(idx)}
function closeBoxDlg(){mask.className='sheet hidden';paused=false;boxDraft=null;ocrAim=false;scanTarget=null;shotBtn.className='shot alt hidden';clearShot()}
function cancelBox(){closeBoxDlg();msg('已取消本箱')}
function saveBox(){flushItems();const d=boxDraft;if(!d)return;const dims=[d.len,d.wid,d.hei];if(!dims.every(x=>x)||!dims.every(x=>isFinite(+x)&&+x>0)){live('产品规格要填完整的三段正数',true);bLen.focus();return}if(!/^\d+$/.test(d.qty)||+d.qty<1){live('箱子数量必填，且是大于 0 的整数',true);bQty.focus();return}if(!/^\d+(\.\d{1,3})?$/.test(d.wgt)||+d.wgt<=0){live('重量必填，且大于 0（最多 3 位小数）',true);bWgt.focus();return}const items=d.items.map(it=>({sku:it.sku.trim(),units:it.units})).filter(it=>it.sku);if(!items.length){live('至少填一个 SKU',true);return}for(const it of items){if(!/^\d+$/.test(it.units)||+it.units<1){live('每个 SKU 的单箱数量都要是大于 0 的整数',true);return}}const gid='G'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);items.forEach(it=>recs.push({no:nextNo(),sku:it.sku,len:d.len,wid:d.wid,hei:d.hei,wgt:d.wgt,qty:d.qty,units:it.units,boxGroup:gid,ts:Date.now()}));try{localStorage.setItem('scanUnits',items[items.length-1].units)}catch(e){}saveRecs();renderRecs();closeBoxDlg();msg('已存 1 箱（'+items.length+' 个 SKU），待传 '+boxCount()+' 箱');msgUntil=Date.now()+2600}
function load(src){return new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=no;document.head.appendChild(s)})}
function pick3(t){const s=String(t==null?'':t).replace(/[×＊*✕✖xх]/g,'X').replace(/[Oo]/g,'0').replace(/[Il|]/g,'1').replace(/[Ss]/g,'5').replace(/[^0-9X.]/g,' '),cand=[],j=s.replace(/ +/g,'');for(const r of s.split(' ')){if(!r||r.indexOf('X')<0)continue;cand.push(r,r.replace(/X+$/,''))}cand.push(j,j.replace(/X+$/,''));const re=/^(\d{2,3}(?:\.\d)?)X(\d{2,3}(?:\.\d)?)X(\d{2,3}(?:\.\d)?)$/;for(const c of cand){const m=String(c).replace(/\.+$/,'').match(re);if(m)return [m[1],m[2],m[3]]}return null}
function pick(t){const a=pick3(t);return a?a.join('X'):''}
function loadRecs(){try{recs=JSON.parse(localStorage.getItem('scanRecs')||'[]')||[];if(!Array.isArray(recs))recs=[]}catch(e){recs=[]}}
function saveRecs(){try{localStorage.setItem('scanRecs',JSON.stringify(recs))}catch(e){msg('本地暂存失败（存储空间可能不足）：'+(e.message||e),true)}}
function nextNo(){let n=0;try{n=+localStorage.getItem('scanSeq')||0;localStorage.setItem('scanSeq',n+1)}catch(e){}return Math.max(n,recs.reduce((m,r)=>Math.max(m,+r.no||0),0))+1}
function peekNo(){let n=0;try{n=+localStorage.getItem('scanSeq')||0}catch(e){}return Math.max(n,recs.reduce((m,r)=>Math.max(m,+r.no||0),0))+1}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function fmtTs(t){const d=new Date(+t||0),p=x=>('0'+x).slice(-2);return p(d.getHours())+':'+p(d.getMinutes())}
function renderRecs(){const gs=groupRecs();recN.textContent=gs.length;pendN.textContent=gs.length;pendTxt.textContent=gs.length?'箱已暂存，点“查看→上传并推OMS”':'对准条码或点“新建一箱”录入，攒够后点“查看→上传并推OMS”';recList.innerHTML=gs.length?gs.map(g=>{const skus=g.recs.map(r=>r.sku+(r.units?'×'+r.units:'')).join('、');return '<div class="groupline"><div class="gi"><i>'+esc(g.recs.length+'个SKU：'+skus)+'</i><em>'+esc(g.len+'×'+g.wid+'×'+g.hei+' · '+g.qty+'箱'+(g.wgt?' · '+g.wgt+'kg':'')+' · 合计'+g.recs.reduce((s,r)=>s+(parseInt(r.units,10)||0),0)+'件')+'</em></div><s data-key="'+esc(g.key)+'">✕</s></div>'}).join(''):'<div class="empty">还没有暂存的记录：扫码或点“新建一箱”开始</div>'}
function stepQ(el,d){const v=parseInt(el.value,10);if(isNaN(v)){if(d<0)return;el.value='1'}else el.value=String(Math.max(1,v+d))}
function openPanel(){panelOpen=true;renderRecs();mask2.className='mask'}
function closePanel(){panelOpen=false;mask2.className='mask hidden'}
async function uploadPush(){if(upBusy)return;if(!recs.length){msg('还没有暂存的记录',true);return}upBusy=true;const b=$("rUp");b.disabled=true;b._t=b.textContent;b.textContent='上传推送中…';try{const r=await apiFetch(UPLOAD_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({count:recs.length,records:recs})});if(r.status===401){await checkAuth();throw new Error('登录已过期，请重新登录后再推送')}const j=await r.json();if(j.code!==0)throw new Error(j.msg||('HTTP '+r.status));const d=j.data||{};const n=recs.length;recs=[];saveRecs();try{localStorage.setItem('scanSeq','0')}catch(e){}renderRecs();closePanel();msg('已推送 OMS草稿：单号 '+(d.omsOrderNo||'?')+'，共 '+(d.pushedCount||0)+' 条');msgUntil=Date.now()+5000}catch(e){msg('推送失败：'+(e.message||e)+' —— 记录仍在本地，可点 ✕ 删掉问题条目后重试',true);msgUntil=Date.now()+6000}finally{upBusy=false;b.disabled=false;b.textContent=b._t}}
async function shoot(){if(ocrBusy){msg('正在识别，请稍候');return}const ph=cropShot(1);if(ph){shotBox.className='shotbox';shotImg.src=ph.toDataURL('image/jpeg',0.9);shotImg.className='';shotPh.className='ph hidden';setTag('识别中…')}else setTag('');msg('识别中…');const m=await ocr();if(m){setTag('✓ '+m.join('×'));if(boxDraft){boxDraft.len=m[0];boxDraft.wid=m[1];boxDraft.hei=m[2];bLen.value=m[0];bWid.value=m[1];bHei.value=m[2]}ocrAim=false;shotBtn.className='shot alt hidden';msg('产品规格已识别，可继续编辑本箱');if(boxDraft)openBoxDlg()}else{setTag('✗ 没认出来',true);msg(lastRaw?'读到「'+clean(lastRaw).slice(0,30)+'」，没凑齐三段：可再拍一次或在弹框手动输入':'没读到尺寸：可再拍一次或在弹框手动输入三段规格',true);ocrAim=false;if(boxDraft)openBoxDlg()}}
function drawSel(){sel.w=Math.min(Math.max(sel.w,.06),1);sel.h=Math.min(Math.max(sel.h,.04),1);sel.l=Math.min(Math.max(sel.l,0),1-sel.w);sel.t=Math.min(Math.max(sel.t,0),1-sel.h);guide.style.left=(sel.l*100)+'%';guide.style.top=(sel.t*100)+'%';guide.style.width=(sel.w*100)+'%';guide.style.height=(sel.h*100)+'%'}
guide.addEventListener('pointerdown',e=>{dragMode=e.target===hd?'resize':'move';const r=cam.getBoundingClientRect();drag0={x:e.clientX,y:e.clientY,l:sel.l,t:sel.t,w:sel.w,h:sel.h,rw:r.width||1,rh:r.height||1};try{guide.setPointerCapture(e.pointerId)}catch(x){}e.preventDefault()});

loadSel();drawSel();loadRecs();renderRecs();checkAuth();pend.onclick=e=>{if(!e.target||!e.target.tagName||e.target.tagName!=='BUTTON')openPanel()};$("pendSee").onclick=openPanel;$("rUp").onclick=uploadPush;$("rClose").onclick=closePanel;newBtn.onclick=()=>{if(boxDraft)return;boxDraft=newBoxDraft();openBoxDlg()};boxCancel.onclick=cancelBox;boxOk.onclick=saveBox;addSku.onclick=()=>{if(!boxDraft)return;armNewSku()};addManual.onclick=()=>{if(!boxDraft)return;addItem();live('手动新增一行，点 SKU 格输入')};btnOcr.onclick=()=>{if(!boxDraft)return;flushItems();renderItems();ocrAim=true;mask.className='sheet hidden';shotBtn.className='shot alt';paused=true;msg('把绿色框套住箱面规格文字，再点上方“📷 拍照识别尺寸”')};bQm.onclick=()=>stepQ(bQty,-1);bQp.onclick=()=>stepQ(bQty,1);[bLen,bWid,bHei,bQty,bWgt].forEach(el=>el.addEventListener('change',flushItems));itemList.oninput=e=>{if(e.target&&e.target.classList&&e.target.classList.contains('itUnits'))updateTotal()};itemList.onchange=e=>{const t=e.target;if(t&&t.classList){if(t.classList.contains('itSku'))boxDraft.items[+t.dataset.i].sku=t.value.trim();else if(t.classList.contains('itUnits'))boxDraft.items[+t.dataset.i].units=t.value.trim()}};itemList.onclick=e=>{const t=e.target;if(!t||t.dataset.i==null)return;if(t.classList&&t.classList.contains('itScan')){armScan(+t.dataset.i);return}if(t.tagName==='S')delItem(+t.dataset.i)};recList.onclick=e=>{const t=e.target;if(t&&t.tagName==='S'){const k=t.dataset.key;recs=recs.filter(r=>(r.boxGroup||('S'+r.no))!==k);saveRecs();renderRecs()}};
shotBox.addEventListener('click',()=>{if(!shotImg.src)return;pvImg.src=shotImg.src;pv.className='pv'});
pv.addEventListener('click',()=>{pv.className='pv hidden'});
$("shot").onclick=shoot;
$("lOut").onclick=async()=>{try{await fetch('/api/auth/logout',{method:'POST',headers:{'X-Token':tokenGet()}})}catch(e){}tokenSet('');toLoginPage()};
