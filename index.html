function centerPick(a){const list=(a||[]).filter(x=>x&&x.rawValue);if(!list.length)return[];if(list.length===1)return[list[0].rawValue];const vw=video.videoWidth||1,vh=video.videoHeight||1,cx=vw/2,cy=vh/2,best={};list.forEach(x=>{let d=0;const b=x.boundingBox;if(b){const dx=b.x+b.width/2-cx,dy=b.y+b.height/2-cy;d=Math.sqrt(dx*dx+dy*dy)}const v=x.rawValue;if(!(v in best)||d<best[v])best[v]=d});const vs=Object.keys(best).sort((p,q)=>best[p]-best[q]);multiT=Date.now();if(vs.length===1)return[vs[0]];if(best[vs[0]]<=Math.min(vw,vh)*0.35)return[vs[0]];return[]}
async function scan(){if(!scanning)return;if(paused||panelOpen){await new Promise(r=>setTimeout(r,200));if(scanning)requestAnimationFrame(scan);return}const quiet=Date.now()<msgUntil;if(step==='bar'){const fast=Date.now()-fastT<FAST_MS;let vals=[];const det=(fast?(detFast||detWide):(detWide||detFast));try{if(det&&video.videoWidth)vals=centerPick(await det.detect(video))}catch(e){detFast=null;detWide=null;if(!quiet)msg('原生识别不可用，已切换到 zxing',true)}if(!vals.length&&(wOk||window.ZXing)){wPass++;const f=cropFrame(wPass%3===0);if(f){if(wOk){const id=++wSeq,r=await Promise.race([wAsk(id,f),new Promise(q=>setTimeout(()=>q(1),1500))]);delete wPend[id];if(r&&r!==1){if(r.text)vals=[r.text];else if(r.err){wOk=false;try{wWk.terminate()}catch(e){}wWk=null}}}else if(window.ZXing){try{const r=decodeZxing(f,fast?ZX_FAST:ZX_WIDE);if(r)vals=[r]}catch(e){}}}}if(vals.length){const v=vals[0];if(v===cand&&Date.now()-candT<CONFIRM_MS)candN++;else{if(cand&&cand!==v)flipT=Date.now();cand=v;candN=1}candT=Date.now();if(candN>=CONFIRM_N){const c2=cand;cand='';candN=0;if(c2!==last||blanked){last=c2;blanked=false;fastT=Date.now();sku.value=c2;msg('条码扫描成功，默认规格 '+DEF_DIMS.join('×')+' 已预填');ocrFail=0;checked=false;askInbound()}else if(!quiet)msg('已扫过：'+last+'，移开条码后可扫下一个')}else if(!quiet)msg(Date.now()-flipT<1200?'识别到多个不同的码：只对准一个条码、稳住一下':'条码确认中…')}else{blanked=true;cand='';candN=0;if(!quiet){if(Date.now()-multiT<1200)msg('画面里有多个条码：只把要扫的那个对准画面中央');else msg(fast?'对准条码即可':'扫不到？条码放画面中间、靠近些、避开反光')}}}else if(!quiet)msg('拖动绿框套住箱面规格文字，再点下方“拍照识别规格”');syncReAsk();await new Promise(r=>setTimeout(r,90));if(scanning)requestAnimationFrame(scan)}
async function ocr(){if(ocrBusy)return null;ocrBusy=true;try{const w=await getTess();if(!video.videoWidth)throw new Error('取不到相机画面');const cnt={},seen=[],ok3=g=>g&&g.every(x=>+x>=5&&+x<=300),add=g=>{if(!g)return;const k=g.join('X');if(!(k in cnt)){cnt[k]=0;seen.push(k)}cnt[k]++};let raw='';const run=async list=>{for(let i=0;i<list.length;i++){const c=list[i];await w.setParameters({tessedit_pageseg_mode:String(c[0])});const t=clean((await w.recognize(c[1])).data.text);if(t.length>raw.length)raw=t;const g=pick3(t);add(g);if(i===1&&g&&ok3(g)&&cnt[g.join('X')]===2)return}};const best=()=>{let r=null;for(const k of seen){if(!r||cnt[k]>cnt[r]||(cnt[k]===cnt[r]&&ok3(k.split('X'))&&!ok3(r.split('X'))))r=k}return r};const A=measImage(0,2),B=measImage(0,1);await run([[8,A],[6,A],[8,B],[6,B],[7,A],[3,A]]);let m=best();if(!m||!ok3(m.split('X'))){const C=measImage(1,2);await run([[8,C],[6,C],[3,C]]);m=best()}lastRaw=raw;if(m)ocrFail=0;else{ocrFail++;if(!checked&&ocrFail>=3){checked=true;await selfCheck();await new Promise(r2=>setTimeout(r2,6000))}}return m?m.split('X'):null}catch(e){msg('规格识别出错：'+(e.message||e),true);console.warn('OCR:',e);return null}finally{ocrBusy=false}}
function syncReAsk(){const on=!!(sku.value&&fullDims()&&!dlgResolve&&!paused&&mask.className.indexOf('hidden')>=0&&mask2.className.indexOf('hidden')>=0);const cls=on?'shot main':'shot main hidden';if(reAsk.className!==cls)reAsk.className=cls}
async function askInbound(){const d=fullDims();if(dlgResolve||!sku.value||!d)return Promise.resolve(false);const k=sku.value+'|'+d.join('X');if(k===askedFor)return Promise.resolve(false);askedFor=k;paused=true;dSku.value=sku.value;setDlgDims(d);dQty.value=qty.value;dUnits.value=units.value||defUnits();dWgt.value=wgt.value||DEF_WGT;$("dlgTitle").textContent='请核对 · 将编号 #'+peekNo()+' · 待传 '+recs.length+' 条';mask.className='mask';return new Promise(ok=>{dlgResolve=ok})}
function closeDlg(ok){const r=dlgResolve;dlgResolve=null;paused=false;mask.className='mask hidden';if(ok){sku.value=String(dSku.value).trim();setDims([String(dLen.value).trim(),String(dWid.value).trim(),String(dHei.value).trim()]);qty.value=String(dQty.value).trim();units.value=String(dUnits.value).trim();wgt.value=String(dWgt.value).trim();try{localStorage.setItem('scanUnits',units.value)}catch(e){}addRec();clearForm()}else{msg('已取消：可点“重新核对”，或把条码移开再对准重扫');msgUntil=Date.now()+3000}askedFor='';syncReAsk();if(r)r(ok)}
function load(src){return new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=no;document.head.appendChild(s)})}
function pick3(t){const s=String(t==null?'':t).replace(/[×＊*✕✖xх]/g,'X').replace(/[Oo]/g,'0').replace(/[Il|]/g,'1').replace(/[Ss]/g,'5').replace(/[^0-9X.]/g,' '),cand=[],j=s.replace(/ +/g,'');for(const r of s.split(' ')){if(!r||r.indexOf('X')<0)continue;cand.push(r,r.replace(/X+$/,''))}cand.push(j,j.replace(/X+$/,''));const re=/^(\d{2,3}(?:\.\d)?)X(\d{2,3}(?:\.\d)?)X(\d{2,3}(?:\.\d)?)$/;for(const c of cand){const m=String(c).replace(/\.+$/,'').match(re);if(m)return [m[1],m[2],m[3]]}return null}
function pick(t){const a=pick3(t);return a?a.join('X'):''}
function loadRecs(){try{recs=JSON.parse(localStorage.getItem('scanRecs')||'[]')||[];if(!Array.isArray(recs))recs=[]}catch(e){recs=[]}}
function saveRecs(){try{localStorage.setItem('scanRecs',JSON.stringify(recs))}catch(e){msg('本地暂存失败（存储空间可能不足）：'+(e.message||e),true)}}
function nextNo(){let n=0;try{n=+localStorage.getItem('scanSeq')||0;localStorage.setItem('scanSeq',n+1)}catch(e){}return Math.max(n,recs.reduce((m,r)=>Math.max(m,+r.no||0),0))+1}
function peekNo(){let n=0;try{n=+localStorage.getItem('scanSeq')||0}catch(e){}return Math.max(n,recs.reduce((m,r)=>Math.max(m,+r.no||0),0))+1}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function fmtTs(t){const d=new Date(+t||0),p=x=>('0'+x).slice(-2);return p(d.getHours())+':'+p(d.getMinutes())}
function addRec(){const r={no:nextNo(),sku:sku.value,len:len.value.trim(),wid:wid.value.trim(),hei:hei.value.trim(),wgt:wgt.value.trim(),qty:qty.value.trim(),units:units.value.trim(),ts:Date.now()};recs.push(r);saveRecs();renderRecs();msg('第 '+r.no+' 号已暂存，待传 '+recs.length+' 条（可继续扫下一件，攒够后点“查看→上传并推OMS”）');msgUntil=Date.now()+2600}
function renderRecs(){const n=recs.length;recN.textContent=n;pendN.textContent=n;pendTxt.textContent=n?'条已暂存，点“查看→上传并推OMS”':'确认会自动编号暂存，点“查看→上传并推OMS”发送';recList.innerHTML=n?recs.map((r,i)=>'<div class="rec"><b>#'+r.no+'</b><div class="ri"><i>'+esc(r.sku)+'</i><em>'+esc(r.len+'×'+r.wid+'×'+r.hei+' · '+r.qty+'箱'+(r.units?'×'+r.units:'')+(r.wgt?' · '+r.wgt+'kg':'')+' · '+fmtTs(r.ts))+'</em></div><s data-i="'+i+'">✕</s></div>').join(''):'<div class="empty">还没有暂存的记录：确认后会自动编号存到这里</div>'}
function stepQ(el,d){const v=parseInt(el.value,10);if(isNaN(v)){if(d<0)return;el.value='1'}else el.value=String(Math.max(1,v+d))}
function openPanel(){panelOpen=true;renderRecs();mask2.className='mask'}
function closePanel(){panelOpen=false;mask2.className='mask hidden'}
async function uploadPush(){if(upBusy)return;if(!recs.length){msg('还没有暂存的记录',true);return}upBusy=true;const b=$("rUp");b.disabled=true;b._t=b.textContent;b.textContent='上传推送中…';try{const r=await apiFetch(UPLOAD_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({count:recs.length,records:recs})});if(r.status===401){await checkAuth();throw new Error('登录已过期，请重新登录后再推送')}const j=await r.json();if(j.code!==0)throw new Error(j.msg||('HTTP '+r.status));const d=j.data||{};const n=recs.length;recs=[];saveRecs();try{localStorage.setItem('scanSeq','0')}catch(e){}renderRecs();closePanel();msg('已推送 OMS草稿：单号 '+(d.omsOrderNo||'?')+'，共 '+(d.pushedCount||0)+' 条');msgUntil=Date.now()+5000}catch(e){msg('推送失败：'+(e.message||e)+' —— 记录仍在本地，可点 ✕ 删掉问题条目后重试',true);msgUntil=Date.now()+6000}finally{upBusy=false;b.disabled=false;b.textContent=b._t}}
function onDimEdit(){step='bar';askInbound();syncReAsk()}
[sku,len,wid,hei,qty,units].forEach(i=>i.addEventListener('change',onDimEdit));
async function shoot(){if(ocrBusy){msg('正在识别，请稍候');return}const ph=cropShot(1);if(ph){shotBox.className='shotbox';shotImg.src=ph.toDataURL('image/jpeg',0.9);shotImg.className='';shotPh.className='ph hidden';setTag('识别中…')}else setTag('');msg('识别中…');const m=await ocr();if(m){setTag('✓ '+m.join('×'));setDims(m);msg('产品规格扫描成功');step='bar';askInbound()}else{setTag('✗ 没认出来',true);msg(lastRaw?'读到「'+clean(lastRaw).slice(0,30)+'」，没凑齐三段：可稍后再拍或手动输入':'没读到尺寸：可稍后再拍或直接手动输入三段规格',true)}}
function drawSel(){sel.w=Math.min(Math.max(sel.w,.06),1);sel.h=Math.min(Math.max(sel.h,.04),1);sel.l=Math.min(Math.max(sel.l,0),1-sel.w);sel.t=Math.min(Math.max(sel.t,0),1-sel.h);guide.style.left=(sel.l*100)+'%';guide.style.top=(sel.t*100)+'%';guide.style.width=(sel.w*100)+'%';guide.style.height=(sel.h*100)+'%'}
guide.addEventListener('pointerdown',e=>{dragMode=e.target===hd?'resize':'move';const r=cam.getBoundingClientRect();drag0={x:e.clientX,y:e.clientY,l:sel.l,t:sel.t,w:sel.w,h:sel.h,rw:r.width||1,rh:r.height||1};try{guide.setPointerCapture(e.pointerId)}catch(x){}e.preventDefault()});
window.addEventListener('pointermove',e=>{if(!drag0)return;const dx=(e.clientX-drag0.x)/drag0.rw,dy=(e.clientY-drag0.y)/drag0.rh;if(dragMode==='resize'){sel.w=drag0.w+dx;sel.h=drag0.h+dy}else{sel.l=drag0.l+dx;sel.t=drag0.t+dy}drawSel()});
window.addEventListener('pointerup',()=>{if(drag0)saveSel();drag0=null});
window.addEventListener('pointercancel',()=>{drag0=null});
loadSel();drawSel();clearForm();loadRecs();renderRecs();checkAuth();pend.onclick=e=>{if(!e.target||!e.target.tagName||e.target.tagName!=='BUTTON')openPanel()};$("pendSee").onclick=openPanel;$("rUp").onclick=uploadPush;$("rClose").onclick=closePanel;$("qm").onclick=()=>stepQ(qty,-1);$("qp").onclick=()=>stepQ(qty,1);$("dqm").onclick=()=>stepQ(dQty,-1);$("dqp").onclick=()=>stepQ(dQty,1);recList.onclick=e=>{const t=e.target;if(t&&t.tagName==='S'){const i=+(t.dataset&&t.dataset.i);if(i>=0&&i<recs.length){recs.splice(i,1);saveRecs();renderRecs()}}};
shotBox.addEventListener('click',()=>{if(!shotImg.src)return;pvImg.src=shotImg.src;pv.className='pv'});
pv.addEventListener('click',()=>{pv.className='pv hidden'});
$("shot").onclick=shoot;
$("reAsk").onclick=()=>{if(!sku.value||!fullDims())return;askedFor='';step='bar';askInbound()};
$("lOut").onclick=async()=>{try{await fetch('/api/auth/logout',{method:'POST',headers:{'X-Token':tokenGet()}})}catch(e){}tokenSet('');toLoginPage()};
$("clr").onclick=()=>{clearForm();askedFor='';step='bar';cand='';candN=0;fastT=Date.now();syncReAsk();msg('已清空，可扫下一件')};
$("dOk").onclick=()=>{const q=String(dQty.value).trim();if(!/^\d+$/.test(q)||+q<1){msg('箱子数量必填，且要是大于 0 的整数',true);dQty.focus();return}const u=String(dUnits.value).trim();if(!/^\d+$/.test(u)||+u<1){msg('单箱数量必填，且要是大于 0 的整数',true);dUnits.focus();return}const w=String(dWgt.value).trim();if(!/^\d+(\.\d{1,3})?$/.test(w)||+w<=0){msg('重量必填，且要大于 0（最多 3 位小数）',true);dWgt.focus();return}closeDlg(true)};
$("dCancel").onclick=()=>closeDlg(false);
start();
</script></body></html>
